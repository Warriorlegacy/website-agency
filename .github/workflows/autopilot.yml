name: 24/7 Autonomous Agency Autopilot

on:
  schedule:
    # Runs every 2 hours continuously in the cloud (even when your PC is turned off)
    - cron: '0 */2 * * *'
  workflow_dispatch:
    # Allows manually triggering an autonomous cycle from GitHub UI with one click
  repository_dispatch:
    # Allows external cron services like cron-job.org to trigger the workflow via API
    types: [autopilot-trigger, cronjob-trigger]

permissions:
  contents: write

jobs:
  autopilot-cycle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run 24/7 Autopilot Cycle
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CAL_API_KEY: ${{ secrets.CAL_API_KEY }}
          VAPI_API_KEY: ${{ secrets.VAPI_API_KEY }}
          VAPI_ASSISTANT_ID: ${{ secrets.VAPI_ASSISTANT_ID }}
          BLAND_API_KEY: ${{ secrets.BLAND_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
        run: |
          echo "🚀 Starting Cloud Autonomous Agency Cycle..."
          node scripts/autopilot.js --once

      - name: Commit & Push Updated CRM Data
        run: |
          git config --global user.name "Apex AI Agency Bot"
          git config --global user.email "bot@apexwebstudio.com"
          git add pipeline.json interactions.json prospects/ demos/ outreach/ proposals/ clients/ reports/ || true
          if git diff --staged --quiet; then
            echo "No changes to commit in this cycle."
          else
            git commit -m "chore(autopilot): autonomous pipeline cycle update [skip ci]"
            git push
            echo "✅ Successfully synced updated CRM pipeline back to repository."
          fi

      - name: Alert Telegram on Workflow Failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node -e "
            import('dns').then(d => {
              try { d.setDefaultResultOrder('ipv4first'); } catch {}
              const token = process.env.TELEGRAM_BOT_TOKEN;
              const chatId = process.env.TELEGRAM_CHAT_ID;
              if (token && chatId) {
                const runUrl = 'https://github.com/' + process.env.GITHUB_REPOSITORY + '/actions/runs/' + process.env.GITHUB_RUN_ID;
                const text = '⚠️ <b>[APEX AI WEB STUDIO] Workflow Run Alert</b>\n\n❌ <i>A cloud workflow cycle encountered an error.</i>\n\n🔍 <a href=\"' + runUrl + '\">View GitHub Actions Execution Log</a>';
                fetch('https://api.telegram.org/bot' + token + '/sendMessage', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ chat_id: chatId, text, parse_mode: 'HTML' })
                }).catch(() => {});
              }
            });
          "

